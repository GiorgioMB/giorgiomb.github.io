# Site
title: Giorgio Micaletto
author: Giorgio Micaletto
description: PhD student in Statistics at UChicago, previously at Bocconi and Aalto.
lang: en
url: https://giorgiomb.github.io
baseurl:

# The pages are plain HTML in _pages/, the project pages in _projects/ with
# _layouts/treatise.liquid, and the shared assets in assets/treatise/.
collections:
  projects:
    output: true

include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - purgecss.config.js
  - README.md
  - requirements.txt
  - vendor
keep_files:
  - CNAME
  - .nojekyll

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Plugins, as installed by the Gemfile.
plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

jekyll-minifier:
  compress_javascript: false # set to false since we are using terser as the js minifier
  exclude: ["robots.txt", "index.html", "publications/index.html", "projects/index.html", "projects/*/index.html", "404.html", "assets/treatise/*"] # the treatise pages ship as written

terser:
  compress:
    drop_console: true

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

imagemagick:
  enabled: false

scholar:
  last_name: [Micaletto]
  first_name: [Giorgio, G.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

pagination:
  enabled: false

# Read by jekyll-3rd-party-libraries, which needs the key even when empty.
third_party_libraries:
  download: false

# The deploy workflow writes the repository name here.
giscus:
  repo:
